<!-- Prism core + Kusto (no line-numbers plugin) -->
<!-- Dark mode -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prism-themes/themes/prism-dracula.min.css"
      media="(prefers-color-scheme: dark)">
<script defer src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-kusto.min.js"></script>

<!-- Optional: let ```kql also work -->
<script defer>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.Prism && Prism.languages.kusto) Prism.languages.kql = Prism.languages.kusto;
  });
</script>
