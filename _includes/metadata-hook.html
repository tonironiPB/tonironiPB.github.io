<meta name="darkreader-lock">

<style>
/* ===== Main Code Block Container ===== */
.custom-code-block {
  position: relative;
  margin: 1.5rem 0;
  border-radius: 0.75rem;
  overflow: hidden;
  background: #282a36;
  font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
  font-size: 1rem;
  line-height: 1.5;
}

/* ===== Header Bar with Controls ===== */
.code-header {
  position: relative;
  height: 2.5rem;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 1rem;
}

/* Traffic lights on the left */
.traffic-lights {
  position: absolute;
  left: 0.5rem;
  display: flex;
  gap: 8px;
}

.traffic-lights .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  opacity: 0.6;
  transition: opacity 0.2s ease;
}

.custom-code-block:hover .traffic-lights .dot {
  opacity: 0.9;
}

.dot.red { background: #ff5f57; }
.dot.yellow { background: #ffbd2e; }
.dot.green { background: #28ca42; }

/* Language label in the center */
.lang-label {
  color: rgba(248, 248, 242, 0.5);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.025em;
}

/* Copy button on the right */
.copy-btn {
  position: absolute;
  right: 0.5rem;
  background: transparent;
  border: none;
  color: rgba(248, 248, 242, 0.4);
  cursor: pointer;
  padding: 0.25rem;
  border-radius: 0.25rem;
  transition: color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
}

.copy-btn:hover {
  color: rgba(248, 248, 242, 0.8);
}

/* Both icons are always present, but only one is visible */
.copy-btn svg {
  width: 16px;
  height: 16px;
  position: absolute;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

/* Default state: show copy icon, hide check */
.copy-btn .copy-icon {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.copy-btn .check-icon {
  opacity: 0;
  transform: scale(0.5) rotate(-90deg);
  color: #50fa7b;
}

/* Copied state: hide copy icon, show check with animation */
.copy-btn.copied .copy-icon {
  opacity: 0;
  transform: scale(0.5) rotate(90deg);
}

.copy-btn.copied .check-icon {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.copy-btn.copied {
  color: #50fa7b;
}

/* Add a subtle bounce effect to the checkmark appearance */
@keyframes subtle-bounce {
  0% {
    transform: scale(0.5) rotate(-90deg);
  }
  50% {
    transform: scale(1.1) rotate(5deg);
  }
  100% {
    transform: scale(1) rotate(0deg);
  }
}

.copy-btn.copied .check-icon {
  animation: subtle-bounce 0.4s ease-out;
}

/* ===== Code Display Area ===== */
.code-container {
  position: relative;
  overflow-x: auto;
  overflow-y: hidden;
}

/* Pre element styling */
.code-pre {
  margin: 0;
  padding: 0;
  background: transparent;
  position: relative;
  counter-reset: line;
}

/* Code element with line numbers */
.code-content {
  display: block;
  padding: 0.5rem 1rem 1rem 2.2rem;
  color: #f8f8f2;
  white-space: pre;
  line-height: 1.5;
  font-family: inherit;
  font-size: inherit;
}

/* Line numbers using CSS counters on each line */
.code-line {
  position: relative;
  display: block;
  margin: 0;
  padding: 0;
  min-height: 1.5em;
  counter-increment: line;
}

.code-line::before {
  content: counter(line);
  position: absolute;
  left: -2.3rem;
  width: 2rem;
  text-align: right;
  color: rgba(248, 248, 242, 0.3);
  user-select: none;
  pointer-events: none;
  padding-right: 0.5rem;
}

/* Empty lines need special handling */
.code-line:empty::after {
  content: '\00a0';
}

/* ===== Syntax Highlighting Colors ===== */
.hl-keyword { 
  color: #C792EA;
  font-weight: 500;
}
.hl-string { 
  color: #C3E88D;
}
.hl-function { 
  color: #82AAFF;
}
.hl-comment { 
  color: #546E7A;
  font-style: italic;
  opacity: 0.8;
}
.hl-number { 
  color: #F78C6C;
}
.hl-operator { 
  color: #89DDFF;
}
.hl-property { 
  color: #FFCB6B;
}
.hl-punctuation { 
  color: #AABFC9;
}

/* ===== Light Theme Support ===== */
[data-theme="light"] .custom-code-block {
  background: #f8f8f8;
}

[data-theme="light"] .code-line::before {
  color: rgba(0, 0, 0, 0.3);
}

[data-theme="light"] .lang-label {
  color: rgba(0, 0, 0, 0.5);
}

[data-theme="light"] .copy-btn {
  color: rgba(0, 0, 0, 0.4);
}

[data-theme="light"] .copy-btn:hover {
  color: rgba(0, 0, 0, 0.7);
}

[data-theme="light"] .code-content {
  color: #2e3440;
}

[data-theme="light"] .hl-keyword { color: #d73a49; }
[data-theme="light"] .hl-string { color: #032f62; }
[data-theme="light"] .hl-function { color: #6f42c1; }
[data-theme="light"] .hl-comment { color: #6a737d; }
[data-theme="light"] .hl-number { color: #005cc5; }
[data-theme="light"] .hl-operator { color: #d73a49; }
[data-theme="light"] .hl-property { color: #005cc5; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Process all code blocks
  function processCodeBlocks() {
    document.querySelectorAll('pre > code').forEach(function(codeElement) {
      // Skip if already processed
      if (codeElement.closest('.custom-code-block')) return;
      
      // Get the code text and language
      const codeText = codeElement.textContent;
      const langClass = Array.from(codeElement.classList)
        .find(cls => cls.startsWith('language-')) || 'language-text';
      const language = langClass.replace('language-', '').toLowerCase();
      
      // Split into lines
      const lines = codeText.split('\n');
      // Remove trailing empty line if present
      if (lines[lines.length - 1] === '') {
        lines.pop();
      }
      
      // Create wrapper
      const wrapper = document.createElement('div');
      wrapper.className = 'custom-code-block';
      
      // Create header
      const header = document.createElement('div');
      header.className = 'code-header';
      
      const trafficLights = document.createElement('div');
      trafficLights.className = 'traffic-lights';
      trafficLights.innerHTML = `
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      `;
      
      const langLabel = document.createElement('span');
      langLabel.className = 'lang-label';
      langLabel.textContent = '</> ' + formatLanguage(language);
      
      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'copy-btn';
      copyBtn.setAttribute('aria-label', 'Copy code');
      
      // Pre-create both icons inside the button to avoid innerHTML changes later
      copyBtn.innerHTML = `
        <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      `;
      
      header.appendChild(trafficLights);
      header.appendChild(langLabel);
      header.appendChild(copyBtn);
      
      // Create code container
      const container = document.createElement('div');
      container.className = 'code-container';
      
      const pre = document.createElement('pre');
      pre.className = 'code-pre';
      
      const code = document.createElement('code');
      code.className = 'code-content ' + langClass;
      
      // Process each line
      lines.forEach(function(line) {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'code-line';
        
        // Apply syntax highlighting for KQL
        if (language === 'kql' || language === 'kusto') {
          highlightLine(line, lineDiv);
        } else {
          lineDiv.textContent = line;
        }
        
        code.appendChild(lineDiv);
      });
      
      // Assemble
      pre.appendChild(code);
      container.appendChild(pre);
      wrapper.appendChild(header);
      wrapper.appendChild(container);
      
      // Replace original
      const originalPre = codeElement.parentElement;
      originalPre.parentElement.replaceChild(wrapper, originalPre);
      
      // Copy functionality - Visual icon swap without DOM changes
      copyBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        
        // Try modern clipboard API first
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(codeText);
            
            // Show checkmark by adding class (no DOM changes)
            copyBtn.classList.add('copied');
            
            // Revert after 2 seconds
            setTimeout(() => {
              copyBtn.classList.remove('copied');
            }, 2000);
            
          } catch (err) {
            console.warn('Copy failed, trying fallback:', err);
            fallbackCopyMinimal();
          }
        } else {
          fallbackCopyMinimal();
        }
        
        function fallbackCopyMinimal() {
          // Create textarea completely outside viewport
          const textarea = document.createElement('textarea');
          textarea.value = codeText;
          textarea.style.position = 'fixed';
          textarea.style.top = '-9999px';
          textarea.style.left = '-9999px';
          textarea.setAttribute('aria-hidden', 'true');
          textarea.setAttribute('tabindex', '-1');
          
          document.body.appendChild(textarea);
          
          // Select and copy
          textarea.select();
          textarea.setSelectionRange(0, textarea.value.length);
          
          try {
            document.execCommand('copy');
            
            // Show success
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.classList.remove('copied');
            }, 2000);
            
          } catch (err) {
            console.error('Copy failed:', err);
          }
          
          // Remove textarea immediately
          document.body.removeChild(textarea);
        }
        
        return false;
      });
    });
  }
  
  // KQL syntax highlighting using DOM manipulation
  function highlightLine(text, container) {
    // KQL keywords
    const keywords = new Set([
      'where', 'extend', 'project', 'summarize', 'by', 'in', 'contains',
      'has_any', 'and', 'or', 'not', 'let', 'join', 'on', 'union',
      'parse_json', 'tostring', 'toint', 'todouble', 'tobool', 'toscalar',
      'distinct', 'top', 'sort', 'limit', 'take', 'count', 'as'
    ]);
    
    // Token patterns
    const tokenPatterns = [
      { regex: /\/\/.*$/, class: 'hl-comment' },
      { regex: /"[^"]*"|'[^']*'/, class: 'hl-string' },
      { regex: /\b\d+\.?\d*\b/, class: 'hl-number' },
      { regex: /[=<>!]+|[|&]+|[+\-*/%]/, class: 'hl-operator' },
      { regex: /[{}()\[\],;]/, class: 'hl-punctuation' },
      { regex: /\b[a-zA-Z_][a-zA-Z0-9_]*\b/, class: null } // Words - check if keyword/function
    ];
    
    let position = 0;
    
    while (position < text.length) {
      let matched = false;
      
      // Try each pattern
      for (const pattern of tokenPatterns) {
        const substring = text.substring(position);
        const match = substring.match(pattern.regex);
        
        if (match && match.index === 0) {
          const matchText = match[0];
          
          if (pattern.class) {
            // Direct class assignment
            const span = document.createElement('span');
            span.className = pattern.class;
            span.textContent = matchText;
            container.appendChild(span);
          } else {
            // Check if it's a keyword or function
            const nextChar = text[position + matchText.length];
            if (nextChar === '(' && matchText !== 'if' && matchText !== 'where') {
              // It's a function
              const span = document.createElement('span');
              span.className = 'hl-function';
              span.textContent = matchText;
              container.appendChild(span);
            } else if (keywords.has(matchText.toLowerCase())) {
              // It's a keyword
              const span = document.createElement('span');
              span.className = 'hl-keyword';
              span.textContent = matchText;
              container.appendChild(span);
            } else if (matchText[0] === matchText[0].toUpperCase()) {
              // Capitalized word - likely a property/type
              const span = document.createElement('span');
              span.className = 'hl-property';
              span.textContent = matchText;
              container.appendChild(span);
            } else {
              // Regular text
              container.appendChild(document.createTextNode(matchText));
            }
          }
          
          position += matchText.length;
          matched = true;
          break;
        }
      }
      
      // If no pattern matched, consume one character
      if (!matched) {
        container.appendChild(document.createTextNode(text[position]));
        position++;
      }
    }
  }
  
  // Language name formatter
  function formatLanguage(lang) {
    const langMap = {
      'js': 'JavaScript',
      'javascript': 'JavaScript',
      'ts': 'TypeScript',
      'typescript': 'TypeScript',
      'py': 'Python',
      'python': 'Python',
      'kql': 'KQL',
      'kusto': 'KQL',
      'html': 'HTML',
      'css': 'CSS',
      'json': 'JSON',
      'bash': 'Bash',
      'sql': 'SQL',
      'ruby': 'Ruby',
      'java': 'Java',
      'go': 'Go'
    };
    
    return langMap[lang] || lang.toUpperCase();
  }
  
  // Run the processing
  setTimeout(processCodeBlocks, 100);
});
</script>
