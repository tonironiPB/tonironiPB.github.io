<!-- Ask Dark Reader not to modify this site -->
<meta name="darkreader-lock">

<!-- Prism Dracula theme (for all visitors) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prism-themes/themes/prism-dracula.min.css">

<!-- Load Prism core and then the Kusto component.
     NOTE: no "defer" and no "manual" — let Prism auto-run. -->
<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-kusto.min.js"></script>

<!-- Make ```kql fences work too -->
<script>
  if (window.Prism && Prism.languages && Prism.languages.kusto) {
    Prism.languages.kql = Prism.languages.kusto;
  }
</script>
