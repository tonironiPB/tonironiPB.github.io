<!-- Ask Dark Reader not to modify this site -->
<meta name="darkreader-lock">

<!-- Debug version to understand what's happening -->
<style>
.custom-code-block {
  position: relative;
  margin: 1.5rem 0;
  border-radius: 0.75rem;
  overflow: hidden;
  background: #282a36;
  font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
  font-size: 1rem;
  line-height: 1.5;
}

.code-header {
  position: relative;
  height: 2.5rem;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 1rem;
}

.traffic-lights {
  position: absolute;
  left: 0.5rem;
  display: flex;
  gap: 8px;
}

.traffic-lights .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  opacity: 0.6;
  transition: opacity 0.2s ease;
}

.custom-code-block:hover .traffic-lights .dot {
  opacity: 0.9;
}

.dot.red { background: #ff5f57; }
.dot.yellow { background: #ffbd2e; }
.dot.green { background: #28ca42; }

.lang-label {
  color: rgba(248, 248, 242, 0.5);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.025em;
}

.copy-btn {
  position: absolute;
  right: 0.5rem;
  background: transparent;
  border: none;
  color: rgba(248, 248, 242, 0.4);
  cursor: pointer;
  padding: 0.25rem;
  border-radius: 0.25rem;
  transition: color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
}

.copy-btn:hover {
  color: rgba(248, 248, 242, 0.8);
}

.copy-btn svg {
  width: 16px;
  height: 16px;
  position: absolute;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

.copy-btn .copy-icon {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.copy-btn .check-icon {
  opacity: 0;
  transform: scale(0.5) rotate(-90deg);
  color: #50fa7b;
}

.copy-btn.copied .copy-icon {
  opacity: 0;
  transform: scale(0.5) rotate(90deg);
}

.copy-btn.copied .check-icon {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.copy-btn.copied {
  color: #50fa7b;
}

@keyframes subtle-bounce {
  0% { transform: scale(0.5) rotate(-90deg); }
  50% { transform: scale(1.1) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}

.copy-btn.copied .check-icon {
  animation: subtle-bounce 0.4s ease-out;
}

.code-container {
  position: relative;
  overflow-x: auto;
  overflow-y: hidden;
}

.code-pre {
  margin: 0;
  padding: 0;
  background: transparent;
  position: relative;
  counter-reset: line;
}

.code-content {
  display: block;
  padding: 0.5rem 1rem 1rem 2.2rem;
  color: #f8f8f2;
  white-space: pre;
  line-height: 1.5;
  font-family: inherit;
  font-size: inherit;
}

.code-line {
  position: relative;
  display: block;
  margin: 0;
  padding: 0;
  min-height: 1.5em;
  counter-increment: line;
}

.code-line::before {
  content: counter(line);
  position: absolute;
  left: -2.3rem;
  width: 2rem;
  text-align: right;
  color: rgba(248, 248, 242, 0.3);
  user-select: none;
  pointer-events: none;
  padding-right: 0.5rem;
}

.code-line:empty::after {
  content: '\00a0';
}

.hl-keyword { color: #C792EA; font-weight: 500; }
.hl-string { color: #C3E88D; }
.hl-function { color: #82AAFF; }
.hl-comment { color: #546E7A; font-style: italic; opacity: 0.8; }
.hl-number { color: #F78C6C; }
.hl-operator { color: #89DDFF; }
.hl-property { color: #FFCB6B; }
.hl-punctuation { color: #AABFC9; }

[data-theme="light"] .custom-code-block { background: #f8f8f8; }
[data-theme="light"] .code-line::before { color: rgba(0, 0, 0, 0.3); }
[data-theme="light"] .lang-label { color: rgba(0, 0, 0, 0.5); }
[data-theme="light"] .copy-btn { color: rgba(0, 0, 0, 0.4); }
[data-theme="light"] .copy-btn:hover { color: rgba(0, 0, 0, 0.7); }
[data-theme="light"] .code-content { color: #2e3440; }
[data-theme="light"] .hl-keyword { color: #d73a49; }
[data-theme="light"] .hl-string { color: #032f62; }
[data-theme="light"] .hl-function { color: #6f42c1; }
[data-theme="light"] .hl-comment { color: #6a737d; }
[data-theme="light"] .hl-number { color: #005cc5; }
[data-theme="light"] .hl-operator { color: #d73a49; }
[data-theme="light"] .hl-property { color: #005cc5; }
</style>

<script>
(function() {
  console.log('Code enhancement script starting...');
  
  var attempts = 0;
  var maxAttempts = 50;
  var foundBlocks = false;
  
  function checkAndProcess() {
    attempts++;
    
    // Debug: Log what we're looking for
    if (attempts === 1) {
      console.log('Looking for code blocks...');
      
      // Let's see what selectors might work
      console.log('Checking various selectors:');
      console.log('pre > code elements:', document.querySelectorAll('pre > code').length);
      console.log('pre code elements:', document.querySelectorAll('pre code').length);
      console.log('.highlight elements:', document.querySelectorAll('.highlight').length);
      console.log('.language-kusto elements:', document.querySelectorAll('.language-kusto').length);
      console.log('.language-kql elements:', document.querySelectorAll('.language-kql').length);
      console.log('div.highlight > pre.highlight > code:', document.querySelectorAll('div.highlight > pre.highlight > code').length);
      console.log('figure.highlight elements:', document.querySelectorAll('figure.highlight').length);
      
      // Log the actual structure of any code blocks found
      var allPres = document.querySelectorAll('pre');
      console.log('Total <pre> elements found:', allPres.length);
      
      if (allPres.length > 0) {
        console.log('First <pre> element structure:', allPres[0].outerHTML.substring(0, 200));
        console.log('Parent of first <pre>:', allPres[0].parentElement ? allPres[0].parentElement.outerHTML.substring(0, 200) : 'No parent');
      }
    }
    
    // Try multiple possible selectors
    var selectors = [
      'pre > code',
      'pre code',
      'div.highlight > pre.highlight > code',
      'figure.highlight > pre > code',
      '.highlighter-rouge pre code',
      '.language-kusto',
      '.language-kql'
    ];
    
    var codeBlocks = null;
    var usedSelector = null;
    
    for (var i = 0; i < selectors.length; i++) {
      var found = document.querySelectorAll(selectors[i]);
      if (found && found.length > 0) {
        codeBlocks = found;
        usedSelector = selectors[i];
        break;
      }
    }
    
    if (codeBlocks && codeBlocks.length > 0 && !foundBlocks) {
      foundBlocks = true;
      console.log('Found ' + codeBlocks.length + ' code blocks using selector: ' + usedSelector);
      
      // Process each code block
      for (var j = 0; j < codeBlocks.length; j++) {
        console.log('Processing code block ' + (j + 1) + '...');
        try {
          processCodeBlock(codeBlocks[j]);
          console.log('Successfully processed code block ' + (j + 1));
        } catch (error) {
          console.error('Error processing code block ' + (j + 1) + ':', error);
        }
      }
      
      return true; // Stop checking
    }
    
    // Log progress occasionally
    if (attempts % 10 === 0) {
      console.log('Still looking for code blocks... (attempt ' + attempts + ')');
    }
    
    // Stop after max attempts
    if (attempts >= maxAttempts) {
      console.log('Stopped looking for code blocks after ' + maxAttempts + ' attempts');
      console.log('Page might not have any code blocks, or they use an unexpected structure');
      return true;
    }
    
    return false;
  }
  
  function processCodeBlock(codeElement) {
    // Skip if already processed
    if (codeElement.closest('.custom-code-block')) {
      console.log('Code block already processed, skipping');
      return;
    }
    
    console.log('Code element class:', codeElement.className);
    console.log('Code element parent:', codeElement.parentElement ? codeElement.parentElement.tagName : 'No parent');
    
    var codeText = codeElement.textContent || '';
    var classes = codeElement.className || '';
    
    // Try to extract language from various possible class patterns
    var language = 'text';
    var patterns = [
      /language-([^\s]+)/,
      /lang-([^\s]+)/,
      /sourceCode\s+([^\s]+)/
    ];
    
    for (var p = 0; p < patterns.length; p++) {
      var match = classes.match(patterns[p]);
      if (match) {
        language = match[1].toLowerCase();
        break;
      }
    }
    
    console.log('Detected language:', language);
    
    var lines = codeText.split('\n');
    if (lines[lines.length - 1] === '') {
      lines.pop();
    }
    
    // Create wrapper
    var wrapper = document.createElement('div');
    wrapper.className = 'custom-code-block';
    
    // Create header
    var header = document.createElement('div');
    header.className = 'code-header';
    
    // Create traffic lights
    var trafficLights = document.createElement('div');
    trafficLights.className = 'traffic-lights';
    
    var dotRed = document.createElement('span');
    dotRed.className = 'dot red';
    var dotYellow = document.createElement('span');
    dotYellow.className = 'dot yellow';
    var dotGreen = document.createElement('span');
    dotGreen.className = 'dot green';
    
    trafficLights.appendChild(dotRed);
    trafficLights.appendChild(dotYellow);
    trafficLights.appendChild(dotGreen);
    
    // Create language label
    var langLabel = document.createElement('span');
    langLabel.className = 'lang-label';
    langLabel.textContent = '// ' + formatLanguage(language);
    
    // Create copy button using DOM methods
    var copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'copy-btn';
    copyBtn.setAttribute('aria-label', 'Copy code');
    
    // Create SVG elements
    var copySvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    copySvg.setAttribute('class', 'copy-icon');
    copySvg.setAttribute('viewBox', '0 0 24 24');
    copySvg.setAttribute('fill', 'none');
    copySvg.setAttribute('stroke', 'currentColor');
    copySvg.setAttribute('stroke-width', '2');
    
    var copyRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    copyRect.setAttribute('x', '9');
    copyRect.setAttribute('y', '9');
    copyRect.setAttribute('width', '13');
    copyRect.setAttribute('height', '13');
    copyRect.setAttribute('rx', '2');
    copyRect.setAttribute('ry', '2');
    copySvg.appendChild(copyRect);
    
    var copyPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    copyPath.setAttribute('d', 'M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1');
    copySvg.appendChild(copyPath);
    
    var checkSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    checkSvg.setAttribute('class', 'check-icon');
    checkSvg.setAttribute('viewBox', '0 0 24 24');
    checkSvg.setAttribute('fill', 'none');
    checkSvg.setAttribute('stroke', 'currentColor');
    checkSvg.setAttribute('stroke-width', '2.5');
    
    var checkPolyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    checkPolyline.setAttribute('points', '20 6 9 17 4 12');
    checkSvg.appendChild(checkPolyline);
    
    copyBtn.appendChild(copySvg);
    copyBtn.appendChild(checkSvg);
    
    // Assemble header
    header.appendChild(trafficLights);
    header.appendChild(langLabel);
    header.appendChild(copyBtn);
    
    // Create code container
    var container = document.createElement('div');
    container.className = 'code-container';
    
    var pre = document.createElement('pre');
    pre.className = 'code-pre';
    
    var code = document.createElement('code');
    code.className = 'code-content ' + 'language-' + language;
    
    // Process lines
    for (var j = 0; j < lines.length; j++) {
      var lineDiv = document.createElement('div');
      lineDiv.className = 'code-line';
      
      if (language === 'kql' || language === 'kusto') {
        highlightKQLLine(lines[j], lineDiv);
      } else {
        lineDiv.textContent = lines[j];
      }
      
      code.appendChild(lineDiv);
    }
    
    // Assemble structure
    pre.appendChild(code);
    container.appendChild(pre);
    wrapper.appendChild(header);
    wrapper.appendChild(container);
    
    // Find the element to replace
    var elementToReplace = codeElement.parentElement;
    
    // Handle various Jekyll/theme structures
    if (elementToReplace && elementToReplace.className && elementToReplace.className.includes('highlight')) {
      // If parent is div.highlight, replace that
      elementToReplace = elementToReplace.parentElement || elementToReplace;
    } else if (elementToReplace && elementToReplace.tagName === 'PRE') {
      // Standard pre > code structure
      // Keep as is
    } else {
      // Unexpected structure
      console.warn('Unexpected code block structure, attempting to replace anyway');
    }
    
    // Replace the original element
    if (elementToReplace && elementToReplace.parentElement) {
      elementToReplace.parentElement.replaceChild(wrapper, elementToReplace);
      console.log('Successfully replaced code block in DOM');
    } else {
      console.error('Could not find parent element to replace');
    }
    
    // Setup copy handler
    copyBtn.onclick = function(e) {
      e.preventDefault();
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(codeText).then(function() {
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.classList.remove('copied');
          }, 2000);
        }).catch(function() {
          fallbackCopy();
        });
      } else {
        fallbackCopy();
      }
      
      function fallbackCopy() {
        var textarea = document.createElement('textarea');
        textarea.value = codeText;
        textarea.style.position = 'fixed';
        textarea.style.top = '-9999px';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        
        try {
          document.execCommand('copy');
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyBtn.classList.remove('copied');
          }, 2000);
        } catch (err) {
          console.error('Copy failed:', err);
        }
        
        document.body.removeChild(textarea);
      }
      
      return false;
    };
  }
  
  function highlightKQLLine(text, container) {
    var keywords = ['where', 'extend', 'project', 'summarize', 'by', 'in', 'contains',
                    'has_any', 'and', 'or', 'not', 'let', 'join', 'on', 'union',
                    'parse_json', 'tostring', 'toint', 'todouble', 'tobool', 'toscalar',
                    'distinct', 'top', 'sort', 'limit', 'take', 'count', 'as'];
    
    var remaining = text;
    
    while (remaining.length > 0) {
      var matched = false;
      
      // Check for strings
      if (remaining[0] === '"' || remaining[0] === "'") {
        var quote = remaining[0];
        var endIndex = 1;
        while (endIndex < remaining.length && remaining[endIndex] !== quote) {
          endIndex++;
        }
        if (endIndex < remaining.length) endIndex++;
        
        var span = document.createElement('span');
        span.className = 'hl-string';
        span.textContent = remaining.substring(0, endIndex);
        container.appendChild(span);
        remaining = remaining.substring(endIndex);
        matched = true;
      }
      
      // Check for words
      if (!matched && /[a-zA-Z_]/.test(remaining[0])) {
        var wordMatch = remaining.match(/^[a-zA-Z_][a-zA-Z0-9_]*/);
        if (wordMatch) {
          var word = wordMatch[0];
          var isKeyword = false;
          
          for (var k = 0; k < keywords.length; k++) {
            if (word.toLowerCase() === keywords[k]) {
              isKeyword = true;
              break;
            }
          }
          
          if (isKeyword) {
            var span = document.createElement('span');
            span.className = 'hl-keyword';
            span.textContent = word;
            container.appendChild(span);
          } else if (remaining[word.length] === '(') {
            var span = document.createElement('span');
            span.className = 'hl-function';
            span.textContent = word;
            container.appendChild(span);
          } else if (word[0] === word[0].toUpperCase() && word[0].match(/[A-Z]/)) {
            var span = document.createElement('span');
            span.className = 'hl-property';
            span.textContent = word;
            container.appendChild(span);
          } else {
            container.appendChild(document.createTextNode(word));
          }
          
          remaining = remaining.substring(word.length);
          matched = true;
        }
      }
      
      // Check for numbers
      if (!matched && /\d/.test(remaining[0])) {
        var numMatch = remaining.match(/^\d+\.?\d*/);
        if (numMatch) {
          var span = document.createElement('span');
          span.className = 'hl-number';
          span.textContent = numMatch[0];
          container.appendChild(span);
          remaining = remaining.substring(numMatch[0].length);
          matched = true;
        }
      }
      
      // Check for operators
      if (!matched && /[=<>!|&+\-*/%]/.test(remaining[0])) {
        var opMatch = remaining.match(/^[=<>!|&+\-*/%]+/);
        if (opMatch) {
          var span = document.createElement('span');
          span.className = 'hl-operator';
          span.textContent = opMatch[0];
          container.appendChild(span);
          remaining = remaining.substring(opMatch[0].length);
          matched = true;
        }
      }
      
      // Default: single character
      if (!matched) {
        container.appendChild(document.createTextNode(remaining[0]));
        remaining = remaining.substring(1);
      }
    }
  }
  
  function formatLanguage(lang) {
    var langMap = {
      'js': 'JavaScript',
      'javascript': 'JavaScript',
      'ts': 'TypeScript',
      'typescript': 'TypeScript',
      'py': 'Python',
      'python': 'Python',
      'kql': 'KQL',
      'kusto': 'KQL',
      'html': 'HTML',
      'css': 'CSS',
      'json': 'JSON',
      'bash': 'Bash',
      'sql': 'SQL',
      'ruby': 'Ruby',
      'java': 'Java',
      'go': 'Go'
    };
    
    return langMap[lang] || lang.toUpperCase();
  }
  
  // Start checking for code blocks
  var interval = setInterval(function() {
    if (checkAndProcess()) {
      clearInterval(interval);
    }
  }, 100);
})();
</script>
