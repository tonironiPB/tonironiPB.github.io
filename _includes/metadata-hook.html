<!-- Ask Dark Reader not to modify this site -->
<meta name="darkreader-lock">

<!-- Prism Dracula for ALL visitors -->
<link rel="stylesheet" href="{{ '/assets/prism/prism-dracula.min.css' | relative_url }}">

<!-- Run Prism manually; we’ll trigger after bundle is present -->
<script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>

<!-- Single bundle: Prism core + Kusto component (same-origin, no CDN) -->
<script defer src="{{ '/assets/prism/prism-kusto.bundle.min.js' | relative_url }}"></script>

<!-- After DOM & bundle ready, alias kql -> kusto and highlight -->
<script>
(function start() {
  if (window.Prism && Prism.languages && (Prism.languages.kusto || Prism.languages.kql)) {
    if (Prism.languages.kusto && !Prism.languages.kql) {
      Prism.languages.kql = Prism.languages.kusto;   // let ```kql fences work too
    }
    Prism.highlightAll();
  } else {
    setTimeout(start, 80); // slow/mobile safety
  }
})();
</script>
