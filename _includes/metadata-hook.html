<!-- Ask Dark Reader not to modify this site -->
<meta name="darkreader-lock">

<!-- Code block enhancement styles -->
<style>
.custom-code-block {
  position: relative;
  margin: 1.5rem 0;
  border-radius: 0.75rem;
  overflow: hidden;
  background: #282a36;
  font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
  font-size: 1rem;
  line-height: 1.5;
}

.code-header {
  position: relative;
  height: 2.5rem;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 1rem;
}

.traffic-lights {
  position: absolute;
  left: 0.5rem;
  display: flex;
  gap: 8px;
}

.traffic-lights .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  opacity: 0.6;
  transition: opacity 0.2s ease;
}

.custom-code-block:hover .traffic-lights .dot {
  opacity: 0.9;
}

.dot.red { background: #ff5f57; }
.dot.yellow { background: #ffbd2e; }
.dot.green { background: #28ca42; }

.lang-label {
  color: rgba(248, 248, 242, 0.5);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.025em;
}

.copy-btn {
  position: absolute;
  right: 0.5rem;
  background: transparent;
  border: none;
  color: rgba(248, 248, 242, 0.4);
  cursor: pointer;
  padding: 0.25rem;
  border-radius: 0.25rem;
  transition: color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
}

.copy-btn:hover {
  color: rgba(248, 248, 242, 0.8);
}

.copy-btn svg {
  width: 16px;
  height: 16px;
  position: absolute;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

.copy-btn .copy-icon {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.copy-btn .check-icon {
  opacity: 0;
  transform: scale(0.5) rotate(-90deg);
  color: #50fa7b;
}

.copy-btn.copied .copy-icon {
  opacity: 0;
  transform: scale(0.5) rotate(90deg);
}

.copy-btn.copied .check-icon {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.copy-btn.copied {
  color: #50fa7b;
}

@keyframes subtle-bounce {
  0% { transform: scale(0.5) rotate(-90deg); }
  50% { transform: scale(1.1) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}

.copy-btn.copied .check-icon {
  animation: subtle-bounce 0.4s ease-out;
}

.code-container {
  position: relative;
  overflow-x: auto;
  overflow-y: hidden;
}

.code-pre {
  margin: 0;
  padding: 0;
  background: transparent;
  position: relative;
  counter-reset: line;
}

.code-content {
  display: block;
  padding: 0.5rem 1rem 1rem 2.2rem;
  color: #f8f8f2;
  white-space: pre;
  line-height: 1.5;
  font-family: inherit;
  font-size: inherit;
}

.code-line {
  position: relative;
  display: block;
  margin: 0;
  padding: 0;
  min-height: 1.5em;
  counter-increment: line;
}

.code-line::before {
  content: counter(line);
  position: absolute;
  left: -2.3rem;
  width: 2rem;
  text-align: right;
  color: rgba(248, 248, 242, 0.3);
  user-select: none;
  pointer-events: none;
  padding-right: 0.5rem;
}

.code-line:empty::after {
  content: '\00a0';
}

.hl-keyword { color: #C792EA; font-weight: 500; }
.hl-string { color: #C3E88D; }
.hl-function { color: #82AAFF; }
.hl-comment { color: #546E7A; font-style: italic; opacity: 0.8; }
.hl-number { color: #F78C6C; }
.hl-operator { color: #89DDFF; }
.hl-property { color: #FFCB6B; }
.hl-punctuation { color: #AABFC9; }

[data-theme="light"] .custom-code-block { background: #f8f8f8; }
[data-theme="light"] .code-line::before { color: rgba(0, 0, 0, 0.3); }
[data-theme="light"] .lang-label { color: rgba(0, 0, 0, 0.5); }
[data-theme="light"] .copy-btn { color: rgba(0, 0, 0, 0.4); }
[data-theme="light"] .copy-btn:hover { color: rgba(0, 0, 0, 0.7); }
[data-theme="light"] .code-content { color: #2e3440; }
[data-theme="light"] .hl-keyword { color: #d73a49; }
[data-theme="light"] .hl-string { color: #032f62; }
[data-theme="light"] .hl-function { color: #6f42c1; }
[data-theme="light"] .hl-comment { color: #6a737d; }
[data-theme="light"] .hl-number { color: #005cc5; }
[data-theme="light"] .hl-operator { color: #d73a49; }
[data-theme="light"] .hl-property { color: #005cc5; }
</style>

<!-- Load the code enhancer JavaScript from separate file -->
<script src="/assets/js/code-enhancer.js" defer></script>
