<style>
/* ===== Main Code Block Container ===== */
.custom-code-block {
  position: relative;
  margin: 1.5rem 0;
  border-radius: 0.75rem;
  overflow: hidden;
  background: #282a36;
  font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
  font-size: 1rem; /* Increased from 0.875rem (14px) to 1rem (16px) */
  line-height: 1.5;
}

/* ===== Header Bar with Controls ===== */
.code-header {
  position: relative;
  height: 2.5rem;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 1rem;
}

/* Traffic lights on the left */
.traffic-lights {
  position: absolute;
  left: 0.5rem; /* Made symmetrical with copy button - 0.5rem from edge */
  display: flex;
  gap: 8px;
}

.traffic-lights .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  opacity: 0.6;
  transition: opacity 0.2s ease;
}

.custom-code-block:hover .traffic-lights .dot {
  opacity: 0.9;
}

.dot.red { background: #ff5f57; }
.dot.yellow { background: #ffbd2e; }
.dot.green { background: #28ca42; }

/* Language label in the center */
.lang-label {
  color: rgba(248, 248, 242, 0.5);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.025em;
}

/* Copy button on the right */
.copy-btn {
  position: absolute;
  right: 0.5rem;
  background: transparent;
  border: none;
  color: rgba(248, 248, 242, 0.4);
  cursor: pointer;
  padding: 0.25rem;
  border-radius: 0.25rem;
  transition: color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
}

.copy-btn:hover {
  color: rgba(248, 248, 242, 0.8);
}

/* Both icons are always present, but only one is visible */
.copy-btn svg {
  width: 16px;
  height: 16px;
  position: absolute;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

/* Default state: show copy icon, hide check */
.copy-btn .copy-icon {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.copy-btn .check-icon {
  opacity: 0;
  transform: scale(0.5) rotate(-90deg);
  color: #50fa7b;
}

/* Copied state: hide copy icon, show check with animation */
.copy-btn.copied .copy-icon {
  opacity: 0;
  transform: scale(0.5) rotate(90deg);
}

.copy-btn.copied .check-icon {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.copy-btn.copied {
  color: #50fa7b;
}

/* Add a subtle bounce effect to the checkmark appearance */
@keyframes subtle-bounce {
  0% {
    transform: scale(0.5) rotate(-90deg);
  }
  50% {
    transform: scale(1.1) rotate(5deg);
  }
  100% {
    transform: scale(1) rotate(0deg);
  }
}

.copy-btn.copied .check-icon {
  animation: subtle-bounce 0.4s ease-out;
}

/* ===== Code Display Area ===== */
.code-container {
  position: relative;
  overflow-x: auto;
  overflow-y: hidden;
}

/* Pre element styling */
.code-pre {
  margin: 0;
  padding: 0;
  background: transparent;
  position: relative;
  counter-reset: line;
}

/* Code element with line numbers */
.code-content {
  display: block;
  padding: 0.5rem 1rem 1rem 2.2rem; /* Reduced left padding from 2.8rem to bring code closer to numbers */
  color: #f8f8f2;
  white-space: pre;
  line-height: 1.5;
  font-family: inherit;
  font-size: inherit;
}

/* Line numbers using CSS counters on each line */
.code-line {
  position: relative;
  display: block;
  margin: 0;
  padding: 0;
  min-height: 1.5em;
  counter-increment: line;
}

.code-line::before {
  content: counter(line);
  position: absolute;
  left: -2.3rem; /* Moved back right from -3.2rem - numbers closer to their natural position */
  width: 2rem; /* Keep width the same */
  text-align: right;
  color: rgba(248, 248, 242, 0.3);
  user-select: none;
  pointer-events: none;
  padding-right: 0.5rem; /* Reduced slightly from 0.7rem for tighter spacing */
}

/* Empty lines need special handling */
.code-line:empty::after {
  content: '\00a0'; /* Non-breaking space to maintain height */
}

/* ===== Syntax Highlighting Colors ===== */
/* Subtle & Professional Color Scheme - Optimized for readability */

/* Dark theme colors - muted and harmonious */
.hl-keyword { 
  color: #C792EA;  /* Soft purple - distinguishable but not jarring */
  font-weight: 500;
}
.hl-string { 
  color: #C3E88D;  /* Soft green - easy on the eyes for text literals */
}
.hl-function { 
  color: #82AAFF;  /* Muted blue - clear but not overwhelming */
}
.hl-comment { 
  color: #546E7A;  /* Dark gray-blue - readable but clearly secondary */
  font-style: italic;
  opacity: 0.8;
}
.hl-number { 
  color: #F78C6C;  /* Soft coral - visible without being bright */
}
.hl-operator { 
  color: #89DDFF;  /* Soft cyan - structural without dominating */
}
.hl-property { 
  color: #FFCB6B;  /* Muted yellow - warm but not glaring */
}
.hl-punctuation { 
  color: #AABFC9;  /* Light gray - present but unobtrusive */
}

/* ===== Light Theme Support ===== */
[data-theme="light"] .custom-code-block {
  background: #f8f8f8;
}

[data-theme="light"] .code-line::before {
  color: rgba(0, 0, 0, 0.3);
}

[data-theme="light"] .lang-label {
  color: rgba(0, 0, 0, 0.5);
}

[data-theme="light"] .copy-btn {
  color: rgba(0, 0, 0, 0.4);
}

[data-theme="light"] .copy-btn:hover {
  color: rgba(0, 0, 0, 0.7);
}

[data-theme="light"] .code-content {
  color: #2e3440;
}

/* Light theme syntax colors */
[data-theme="light"] .hl-keyword { color: #d73a49; }
[data-theme="light"] .hl-string { color: #032f62; }
[data-theme="light"] .hl-function { color: #6f42c1; }
[data-theme="light"] .hl-comment { color: #6a737d; }
[data-theme="light"] .hl-number { color: #005cc5; }
[data-theme="light"] .hl-operator { color: #d73a49; }
[data-theme="light"] .hl-property { color: #005cc5; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  console.log('Script loaded and DOM ready');
  
  // Process all code blocks
  function processCodeBlocks() {
    console.log('Starting processCodeBlocks');
    const codeBlocks = document.querySelectorAll('pre > code');
    console.log('Found code blocks:', codeBlocks.length);
    
    codeBlocks.forEach(function(codeElement, index) {
      console.log(`Processing block ${index}:`, codeElement);
      
      // Skip if already processed
      if (codeElement.closest('.custom-code-block')) {
        console.log('Block already processed, skipping');
        return;
      }
      
      // Get the code text and language
      const codeText = codeElement.textContent;
      console.log('Code text length:', codeText.length);
      console.log('First 100 chars:', codeText.substring(0, 100));
      
      const langClass = Array.from(codeElement.classList)
        .find(cls => cls.startsWith('language-')) || 'language-text';
      const language = langClass.replace('language-', '').toLowerCase();
      console.log('Language detected:', language);
      
      // Split into lines
      const lines = codeText.split('\n');
      console.log('Number of lines:', lines.length);
      
      // Remove trailing empty line if present
      if (lines[lines.length - 1] === '') {
        lines.pop();
        console.log('Removed trailing empty line');
      }
      
      // [Rest of your code continues here...]
      // Create wrapper
      const wrapper = document.createElement('div');
      wrapper.className = 'custom-code-block';
      
      // [Continue with the rest of your original code...]
    });
  }
  
  // [Include your highlightLine and formatLanguage functions here]
  
  // Run the processing
  console.log('Setting timeout for processCodeBlocks');
  setTimeout(processCodeBlocks, 100);
});
</script>
